[nauticock]
command = //NauticockNotifier/.venv/bin/python3 /NauticockNotifier/notify.py

[auth]
username = user
password = password

[networks]
networks = 1.0.0.0/8 2.0.0.0/8
ignore = 127.0.0.1 127.0.0.2

# Name section after value in cat /etc/os-release | grep NAME
[Debian GNU/Linux]
lib_update = sudo -S apt-get update,sudo -S apt-get upgrade -y

[Rocky Linux]
lib_update = sudo -S dnf update,sudo -S dnf upgrade -y